  gpt-image-2:
    provider: xiaole
    service: lechuang
    type: image
    async: false
    verified: true
    input_types: [text]
    output_types: [image]
    supported_references: []
    image_size: [512, 1K, 2K, 4K]
    aspect_ratio: ["1:1", "16:9", "9:16", "3:4"]
    duration: []
    capabilities:
