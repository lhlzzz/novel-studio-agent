contract:
  verified: true
  reason: "XiaoleAI OpenAI-compatible image API: POST /images/generations, response_format=b64_json."
  protocol: openai-compatible
  provider: xiaole
  service: lechuang
  credential_env: XIAOLEAI_API_KEY
  base_url_env: XIAOLEAI_BASE_URL
  default_base_url: https://api.xiaoleai.team/v1
  endpoints:
    images_generations: /images/generations
    image_created: /image/created
  video:
    verified: false
