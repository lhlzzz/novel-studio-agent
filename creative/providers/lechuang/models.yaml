contract:
  verified: true
  reason: "Official XiaoleAI image API: POST /images/generations, response_format=b64_json."
  protocol: openai-compatible
  provider: xiaole
  service: lechuang
  credential_env: XIAOLEAI_API_KEY
  base_url_env: XIAOLEAI_BASE_URL
  default_base_url: https://api.xiaoleai.team/v1
  endpoints:
    images_generations: /images/generations
    videos_create: /videos
    videos_status: /videos/{video_id}
    videos_content: /videos/{video_id}/content
  video:
    verified: false
    documented: true
    reason: "Official async contract POST /videos + GET /videos/{id} + GET /videos/{id}/content. Live verification has not succeeded."
