models:
  - provider: lechuang
    model: lechuang.image.claimed
    input_types: [text, image]
    output_types: [image]
    supported_references: [image, character]
    resolution: [720p, 1080p]
    aspect_ratio: ["9:16", "16:9", "1:1"]
    duration: []
    async: true
    verified: false
    capabilities: [text_to_image, image_to_image]
  - provider: lechuang
    model: lechuang.video.claimed
    input_types: [text, image, video]
    output_types: [video]
    supported_references: [image, video, character]
    resolution: [720p, 1080p]
    aspect_ratio: ["9:16", "16:9"]
    duration: ["4", "5", "8", "10", "15"]
    async: true
    verified: false
    capabilities: [text_to_video, image_to_video, video_extend, video_edit]
  - provider: mock
    model: mock.default
    input_types: [text, image, video]
    output_types: [image, video, text]
    supported_references: [image, video, character]
    resolution: [720p]
    aspect_ratio: ["9:16", "16:9", "1:1"]
    duration: ["4", "8", "15"]
    async: true
    verified: false
    capabilities: [text_to_image, image_to_image, text_to_video, image_to_video]
