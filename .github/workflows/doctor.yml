name: doctor

on:
  push:
    branches: [main]
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml sqlalchemy alembic python-dotenv
      - name: Social doctor architecture
        run: python -c "from scripts.social_doctor import run; checks=run(); bad=[n for n in ('Runtime','Production Store','Scheduler','Publish Gate','Reconciliation','Analytics') if checks[n].get('status') not in {'PASS','CONFIGURED','BLOCKED_EXTERNAL'}]; raise SystemExit('architecture failed: '+str(bad) if bad else 0)"
      - name: Meiti doctor
        run: python scripts/meiti_doctor.py || true
