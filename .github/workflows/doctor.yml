name: doctor

on:
  push:
    branches: [main]

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Social doctor
        run: python scripts/social_doctor.py
      - name: Meiti doctor
        run: python scripts/meiti_doctor.py
