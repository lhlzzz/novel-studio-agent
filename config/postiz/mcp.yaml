# Postiz exposes MCP over streamable HTTP. Keep the API key outside Git.
provider: postiz
enabled: false
runtime_verified: false
transport: streamable-http
endpoint: ${POSTIZ_API_URL:-http://127.0.0.1:4007}/mcp
auth: bearer
required_env:
  - POSTIZ_API_URL
  - POSTIZ_API_KEY
expected_tools:
  - integrationList
  - integrationSchema
  - schedulePostTool
