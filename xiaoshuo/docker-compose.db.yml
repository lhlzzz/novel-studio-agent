services:
  db:
    image: postgres:16
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: xiaoshuo
      POSTGRES_USER: xiaoshuo
      POSTGRES_PASSWORD: xiaoshuo
    ports:
      - "5443:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaoshuo -d xiaoshuo"]
      interval: 10s
      timeout: 5s
      retries: 5
