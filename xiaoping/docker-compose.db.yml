services:
  db:
    image: postgres:16
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: xiaoping
      POSTGRES_USER: xiaoping
      POSTGRES_PASSWORD: xiaoping
    ports:
      - "5444:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaoping -d xiaoping"]
      interval: 10s
      timeout: 5s
      retries: 5
